<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创建应用系统台账 - 赛领OpsPilot管理平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #f5f7fa;
            color: #333;
            line-height: 1.6;
        }
        
        /* ========== 顶部Banner ========== */
        .header-banner {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 0;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.3);
        }
        
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 22px;
            font-weight: 600;
        }
        
        .logo-icon {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        
        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            opacity: 0.9;
        }
        
        .user-avatar {
            width: 36px;
            height: 36px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        
        /* ========== 导航Tab ========== */
        .nav-tabs {
            display: flex;
            padding: 0 32px;
            gap: 8px;
        }
        
        .nav-tab {
            padding: 14px 24px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
            opacity: 0.7;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: white;
        }
        
        .nav-tab:hover {
            opacity: 1;
            background: rgba(255,255,255,0.1);
        }
        
        .nav-tab.active {
            opacity: 1;
            border-bottom-color: white;
            background: rgba(255,255,255,0.15);
            font-weight: 500;
        }
        
        /* ========== 主内容区 ========== */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 32px;
        }
        
        /* ========== 页面标题栏 ========== */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .page-title {
            font-size: 24px;
            font-weight: 600;
            color: #333;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .page-title-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        
        .page-actions {
            display: flex;
            gap: 12px;
        }
        
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: white;
            color: #666;
            border: 1px solid #d9d9d9;
        }
        
        .btn-secondary:hover {
            background: #f5f5f5;
            border-color: #667eea;
            color: #667eea;
        }
        
        /* ========== 表单容器 ========== */
        .form-container {
            background: white;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        
        .form-section {
            margin-bottom: 32px;
        }
        
        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #f0f0f0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .section-title .icon {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        
        .form-group label {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #333;
        }
        
        .form-group label .required {
            color: #ff4d4f;
            margin-left: 4px;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 10px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }
        
        /* ========== 功能模块管理 ========== */
        .module-section {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 24px;
            border: 1px dashed #d9d9d9;
        }
        
        .module-list {
            margin-bottom: 16px;
        }
        
        .module-item {
            background: white;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid #e8e8e8;
        }
        
        .module-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .module-number {
            font-size: 13px;
            color: #667eea;
            font-weight: 600;
        }
        
        .module-delete {
            color: #ff4d4f;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .module-row {
            display: grid;
            grid-template-columns: 1.5fr 2fr 1fr auto;
            gap: 12px;
            align-items: center;
        }
        
        .module-input {
            padding: 8px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            font-size: 13px;
        }
        
        .module-input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn-add-module {
            width: 100%;
            padding: 12px;
            background: white;
            border: 2px dashed #667eea;
            border-radius: 8px;
            color: #667eea;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-add-module:hover {
            background: #f0f3ff;
        }
        
        /* ========== 表单操作 ========== */
        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 40px;
            padding-top: 24px;
            border-top: 1px solid #f0f0f0;
        }
        
        .btn-cancel {
            padding: 12px 32px;
            background: #f5f5f5;
            color: #666;
            border: 1px solid #d9d9d9;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-cancel:hover {
            background: #e8e8e8;
        }
        
        .btn-submit {
            padding: 12px 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-submit:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        /* ========== 提示信息 ========== */
        .info-tip {
            background: #e6f7ff;
            border: 1px solid #91d5ff;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 24px;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }
        
        .info-tip-icon {
            color: #096dd9;
            font-size: 16px;
        }
        
        .info-tip-text {
            font-size: 13px;
            color: #096dd9;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <!-- 顶部Banner -->
    <div class="header-banner">
        <div class="header-top">
            <div class="logo">
                <div class="logo-icon">🤖</div>
                <span>赛领OpsPilot管理平台</span>
            </div>
            <div class="header-actions">
                <div class="user-info">
                    <span>运维管理员</span>
                    <div class="user-avatar">👤</div>
                </div>
            </div>
        </div>
        <div class="nav-tabs">
            <a href="plan-management.html" class="nav-tab">
                <span>📋</span>
                <span>计划管理</span>
            </a>
            <a href="inventory-management.html" class="nav-tab active">
                <span>📚</span>
                <span>台账管理</span>
            </a>
            <a href="#" class="nav-tab">
                <span>⚙️</span>
                <span>工作流编排</span>
            </a>
            <a href="#" class="nav-tab">
                <span>📦</span>
                <span>交付物管理</span>
            </a>
            <a href="#" class="nav-tab">
                <span>✅</span>
                <span>核验执行</span>
            </a>
            <a href="#" class="nav-tab">
                <span>📖</span>
                <span>知识库</span>
            </a>
        </div>
    </div>
    
    <!-- 主内容区 -->
    <div class="container">
        <!-- 页面标题 -->
        <div class="page-header">
            <div class="page-title">
                <div class="page-title-icon">🖥️</div>
                <div>
                    <div style="font-size: 20px; font-weight: 600;">创建应用系统台账</div>
                    <div style="font-size: 13px; color: #666; font-weight: normal; margin-top: 4px;">台账管理 &gt; 应用系统台账 &gt; 创建</div>
                </div>
            </div>
            <div class="page-actions">
                <button class="btn btn-secondary" onclick="history.back()">
                    <span>←</span>
                    <span>返回列表</span>
                </button>
            </div>
        </div>
        
        <!-- 提示信息 -->
        <div class="info-tip">
            <span class="info-tip-icon">ℹ️</span>
            <span class="info-tip-text">创建应用系统台账后，系统将自动生成唯一台账ID。该台账可在创建计划时被引用，系统会自动将计划ID关联到台账的<code>related_plan_ids</code>字段中。</span>
        </div>
        
        <!-- 表单 -->
        <div class="form-container">
            <!-- 基本信息 -->
            <div class="form-section">
                <div class="section-title">
                    <span class="icon">1</span>
                    基本信息
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>应用名称 <span class="required">*</span></label>
                        <input type="text" placeholder="请输入应用系统名称，如：订单管理系统">
                    </div>
                    <div class="form-group">
                        <label>主机名</label>
                        <input type="text" placeholder="如：order-server-01">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>应用地址URL</label>
                        <input type="text" placeholder="https://order.example.com">
                    </div>
                    <div class="form-group">
                        <label>系统上线时间 <span class="required">*</span></label>
                        <input type="datetime-local">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group full-width">
                        <label>应用情况说明</label>
                        <textarea placeholder="描述应用系统的业务功能、使用场景、重要性等级等"></textarea>
                    </div>
                </div>
            </div>
            
            <!-- 负责人信息 -->
            <div class="form-section">
                <div class="section-title">
                    <span class="icon">2</span>
                    负责人信息
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>业务负责人 <span class="required">*</span></label>
                        <input type="text" placeholder="业务负责人姓名">
                    </div>
                    <div class="form-group">
                        <label>业务负责人联系方式 <span class="required">*</span></label>
                        <input type="text" placeholder="邮箱或电话">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>项目负责人 <span class="required">*</span></label>
                        <input type="text" placeholder="项目负责人姓名">
                    </div>
                    <div class="form-group">
                        <label>项目负责人联系方式 <span class="required">*</span></label>
                        <input type="text" placeholder="邮箱或电话">
                    </div>
                </div>
            </div>
            
            <!-- 功能模块 -->
            <div class="form-section">
                <div class="section-title">
                    <span class="icon">3</span>
                    功能模块信息
                </div>
                <div class="module-section">
                    <div class="module-list">
                        <div class="module-item">
                            <div class="module-header">
                                <span class="module-number">模块 1</span>
                                <span class="module-delete">🗑️ 删除</span>
                            </div>
                            <div class="module-row">
                                <input type="text" class="module-input" placeholder="模块名称">
                                <input type="text" class="module-input" placeholder="模块描述">
                                <input type="date" class="module-input">
                                <select class="module-input" style="width: 100px;">
                                    <option value="active">启用</option>
                                    <option value="inactive">停用</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <button class="btn-add-module">
                        <span>+</span>
                        <span>添加功能模块</span>
                    </button>
                </div>
            </div>
            
            <!-- 表单操作 -->
            <div class="form-actions">
                <button class="btn-cancel" onclick="history.back()">取消</button>
                <button class="btn-submit">创建台账</button>
            </div>
        </div>
    </div>
</body>
</html>
